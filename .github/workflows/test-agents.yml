name: Test Agents
run-name: Test agents (${{ github.ref_name }})

"on":
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover-agent-matrix:
    name: Discover agent matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: generate
        run: |
          matrix="$(scripts/generate-agent-matrix.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test-agents:
    needs: discover-agent-matrix
    name: Agent ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agent-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e  # 4.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Build agent image
        env:
          AGENT: ${{ matrix.agent }}
          IMAGE: aicage-custom-samples:test-agent-${{ matrix.agent }}
        run: |
          chmod +x scripts/*.sh agents/*/*.sh
          scripts/build-agent.sh \
            --agent "$AGENT" \
            --base-image "ghcr.io/aicage/aicage-image-base:ubuntu" \
            --image "$IMAGE"

      - name: Run agent smoke tests
        env:
          AGENT: ${{ matrix.agent }}
          IMAGE: aicage-custom-samples:test-agent-${{ matrix.agent }}
        run: |
          scripts/test-agent.sh \
            --agent "$AGENT" \
            --image "$IMAGE"
