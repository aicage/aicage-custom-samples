name: Test Base Images
run-name: Test base images (${{ github.ref_name }})

"on":
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover-base-matrix:
    name: Discover base image matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate matrix
        id: generate
        run: |
          matrix="$(scripts/generate-base-matrix.py)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  test-base-images:
    needs: discover-base-matrix
    name: Base ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-base-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e  # 4.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Build base image
        env:
          BASE: ${{ matrix.base }}
          IMAGE: aicage-custom-samples:test-base-${{ matrix.base }}
        run: |
          scripts/build-base.sh \
            --base "$BASE" \
            --image "$IMAGE"

      - name: Run base smoke tests
        env:
          BASE: ${{ matrix.base }}
          IMAGE: aicage-custom-samples:test-base-${{ matrix.base }}
        run: |
          scripts/test-base.sh \
            --base "$BASE" \
            --image "$IMAGE"
